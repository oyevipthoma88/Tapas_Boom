# Fly.io deployment configuration for the Telegram status bot.
#
# Setup:
#   1. fly auth login
#   2. fly launch --copy-config --no-deploy --region bom
#   3. fly secrets set TELEGRAM_BOT_TOKEN=xxxx
#   4. fly deploy

app = "tapas-boom"
primary_region = "bom"
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[deploy]
  strategy = "immediate"
